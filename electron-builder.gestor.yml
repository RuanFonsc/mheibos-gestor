appId: br.com.mheibos.gestor
productName: Mheibos Gestor
directories:
  output: release/gestor
files:
  - electron/**
  - package.json
asar: true
win:
  target:
    - nsis
  artifactName: Mheibos-Gestor-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
