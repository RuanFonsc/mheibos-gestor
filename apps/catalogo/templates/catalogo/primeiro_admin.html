<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mheibos Gestor - Primeiro administrador</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top left, rgba(75,102,255,.22), transparent 34%), #1a1d27;
      color: #fff;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    main {
      width: min(520px, calc(100vw - 32px));
      border: 1px solid #2d3154;
      border-radius: 20px;
      background: #22253a;
      padding: 30px;
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
    }
    h1 { margin: 0; font-size: 28px; }
    p { color: #aeb8e8; line-height: 1.45; }
    label { display: block; margin: 18px 0 8px; color: #dce3ff; font-size: 12px; font-weight: 800; text-transform: uppercase; }
    input {
      width: 100%;
      min-height: 50px;
      border: 1px solid #3d4275;
      border-radius: 12px;
      background: #202338;
      color: #fff;
      padding: 0 14px;
      font-size: 15px;
    }
    button {
      width: 100%;
      min-height: 52px;
      margin-top: 22px;
      border: 0;
      border-radius: 12px;
      background: #4b66ff;
      color: #fff;
      font-weight: 900;
      cursor: pointer;
    }
    .message { margin-top: 12px; color: #ffb347; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <h1>Mheibos Gestor</h1>
    <p>Cadastre o primeiro Administrador Geral desta instalacao. Ele podera criar os proximos usuarios e definir permissoes.</p>
    {% for message in messages %}
      <div class="message">{{ message }}</div>
    {% endfor %}
    <form method="post">
      {% csrf_token %}
      <label>Nome</label>
      <input name="nome" autocomplete="name" autofocus required>
      <label>Senha</label>
      <input name="senha" type="password" autocomplete="new-password" required>
      <label>Confirmar senha</label>
      <input name="confirmar_senha" type="password" autocomplete="new-password" required>
      <button type="submit">Criar administrador geral</button>
    </form>
  </main>
</body>
</html>
