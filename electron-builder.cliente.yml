appId: br.com.mheibos.gestor.cliente
productName: Mheibos Gestor Cliente
directories:
  output: release/cliente
files:
  - electron/**
  - package.json
asar: true
win:
  target:
    - nsis
  artifactName: Mheibos-Gestor-Cliente-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
