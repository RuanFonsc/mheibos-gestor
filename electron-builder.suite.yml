appId: br.com.mheibos.suite
productName: Mheibos Suite
directories:
  output: release/suite
files:
  - electron/**
  - package.json
extraResources:
  - from: dist/backend
    to: backend
asar: true
win:
  target:
    - nsis
  artifactName: Mheibos-Suite-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
